[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-aids-replication"
version = "0.1.0"
description = "Pacote Python para replicar o fluxo AIDS originalmente escrito em R."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_aids_replication*"]
